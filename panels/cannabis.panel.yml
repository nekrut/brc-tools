# Cannabis sativa panel for WF-A staging. Key meanings: scripts/stage_wfa_panel.py (PANEL_KEYS).
#
# ⚠ WHY EACH GENOME IS OR IS NOT HERE IS RECORDED WITH THE SURVEY, NOT IN THIS REPOSITORY.
# Membership is a dataset decision -- cultivars, chemotypes, annotation provenance, and the
# contiguity measurements behind the inclusion criterion (contig N50, not assembly level). This
# file is only the resolved answer, so that the staging code stays organism-agnostic.
name: Cannabis sativa

# 19 from the pre-staged collection plus the four in `extra`. Asserted at run time.
expected_assemblies: 23

# ⚠ REQUIRED IN PRACTICE, not an optimisation: `by_url` covers 8 of the 23, so without this
# collection the run resolves to 8 and the count check refuses.
raw_collection: cab4808ec6fe5c51

# Members the collection does not hold. JL_Father x JL_Mother -> JL5 is a trio (Type II parents,
# Type III offspring); JL_DASH is a different cultivar, kept as a cross-group assembly.
extra: [JL_Father, JL_Mother, JL5, JL_DASH]

# identifier -> {accession, assembly_name}. Both are needed: the NCBI FTP path is built from the
# pair, so a wrong assembly_name is a 404 at fetch time rather than a validation error.
by_url:
  cs10_NCBI_RefSeq_softmasked: {accession: GCF_900626175.2, assembly_name: cs10}
  ASM2916894v1: {accession: GCF_029168945.1, assembly_name: ASM2916894v1}
  T2T_GCA_054642775.1_IMPD: {accession: GCA_054642775.1, assembly_name: ASM5464277v1}
  T2T_GCA_054642815.1_IMPD: {accession: GCA_054642815.1, assembly_name: ASM5464281v1}
  JL_Father: {accession: GCA_013030025.1, assembly_name: JL_Father}
  JL_Mother: {accession: GCA_012923435.1, assembly_name: JL_Mother}
  JL5: {accession: GCA_016415525.1, assembly_name: JL5}
  JL_DASH: {accession: GCA_003660325.2, assembly_name: Oct15_3.7Mb_N50_Jamaican_Lion_Assembly}

# The members that HAVE a protein FASTA, mapped to the file key their `_protein_primary.faa.gz` is
# named by. Seven of 23 is the steady state, not a partial stage: the other 16 have no annotation
# published anywhere and get their genes from WF-C2 by projection.
proteomes:
  cs10_NCBI_RefSeq_softmasked: cs10
  ASM2916894v1: ASM2916894v1
  T2T_GCA_054642775.1_IMPD: ASM5464277v1
  T2T_GCA_054642815.1_IMPD: ASM5464281v1
  JL_Father: JL_Father
  JL_Mother: JL_Mother
  Cannbio2_GigaDB: Cannbio2

# A subset of `proteomes`. The two RefSeq annotations are the curated ones; the T2T pair are
# submitter annotations, fine as projection targets but a different provenance for a reference set.
anchors:
  cs10_NCBI_RefSeq_softmasked: cs10
  ASM2916894v1: ASM2916894v1
